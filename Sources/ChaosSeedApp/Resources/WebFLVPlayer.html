<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body, video {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    video {
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline></video>
  <script src="Vendor/mpegts.js"></script>
  <script>
    const video = document.getElementById("video");
    let player = null;
    let lastPlayerError = "";
    let activeSessionId = "";

    function notify(type, message) {
      window.webkit?.messageHandlers?.chaosSeed?.postMessage({
        type,
        message: message || "",
        sessionId: activeSessionId
      });
    }

    function destroyPlayback() {
      if (!player) return;
      try { player.pause(); } catch (_) {}
      try { player.unload(); } catch (_) {}
      try { player.detachMediaElement(); } catch (_) {}
      try { player.destroy(); } catch (_) {}
      player = null;
      video.removeAttribute("src");
      video.load();
    }

    async function startPlayback(config) {
      destroyPlayback();
      activeSessionId = config.sessionId || "";
      lastPlayerError = "";
      if (!window.mpegts || !mpegts.isSupported()) {
        notify("error", "当前 WebKit 不支持 Media Source Extensions");
        return;
      }

      player = mpegts.createPlayer({
        type: "flv",
        isLive: true,
        url: config.url,
        cors: true,
        withCredentials: false
      }, {
        enableWorker: false,
        enableStashBuffer: false,
        stashInitialSize: 128 * 1024,
        liveBufferLatencyChasing: true,
        liveBufferLatencyMaxLatency: 3,
        liveBufferLatencyMinRemain: 0.5,
        headers: config.headers || {}
      });

      player.on(mpegts.Events.ERROR, (type, detail, info) => {
        const reason = info?.msg || info?.code || `${type}: ${detail}`;
        lastPlayerError = String(reason);
        notify("error", lastPlayerError);
      });
      player.attachMediaElement(video);
      player.load();
      notify("ready");
      try {
        await player.play();
      } catch (error) {
        notify("error", error?.message || String(error));
      }
    }

    video.addEventListener("playing", () => notify("playing"));
    video.addEventListener("pause", () => notify("paused"));
    video.addEventListener("error", () => {
      if (!lastPlayerError) {
        notify("error", video.error?.message || "HTMLVideoElement 播放失败");
      }
    });
    window.addEventListener("beforeunload", destroyPlayback);
  </script>
</body>
</html>
