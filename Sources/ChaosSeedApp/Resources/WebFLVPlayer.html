<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body, video {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    video {
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <script src="Vendor/mpegts.js"></script>
  <script>
    const video = document.getElementById("video");
    let player = null;
    let lastPlayerError = "";
    let activeSessionId = "";

    function notify(type, message) {
      window.webkit?.messageHandlers?.chaosSeed?.postMessage({
        type,
        message: message || "",
        sessionId: activeSessionId
      });
    }

    function supportsPictureInPicture() {
      return Boolean(
        (document.pictureInPictureEnabled && video.requestPictureInPicture) ||
        video.webkitSupportsPresentationMode &&
          video.webkitSetPresentationMode
      );
    }

    function notifyPictureInPictureAvailability() {
      window.webkit?.messageHandlers?.chaosSeed?.postMessage({
        type: "pictureInPictureAvailability",
        available: supportsPictureInPicture(),
        sessionId: activeSessionId
      });
    }

    function notifyPictureInPictureState() {
      const active = document.pictureInPictureElement === video ||
        video.webkitPresentationMode === "picture-in-picture";
      window.webkit?.messageHandlers?.chaosSeed?.postMessage({
        type: "pictureInPictureState",
        active,
        sessionId: activeSessionId
      });
    }

    function notifyPlaybackState() {
      window.webkit?.messageHandlers?.chaosSeed?.postMessage({
        type: "playbackState",
        playing: !video.paused,
        muted: video.muted,
        volume: video.volume,
        sessionId: activeSessionId
      });
    }

    async function togglePlayback() {
      if (video.paused) {
        await video.play();
      } else {
        video.pause();
      }
    }

    function setMuted(muted) {
      video.muted = Boolean(muted);
      notifyPlaybackState();
    }

    function setVolume(volume) {
      video.volume = Math.min(1, Math.max(0, Number(volume)));
      notifyPlaybackState();
    }

    async function togglePictureInPicture() {
      try {
        if (document.pictureInPictureElement === video) {
          await document.exitPictureInPicture();
        } else if (video.webkitPresentationMode === "picture-in-picture") {
          video.webkitSetPresentationMode("inline");
        } else if (document.pictureInPictureEnabled && video.requestPictureInPicture) {
          await video.requestPictureInPicture();
        } else if (
          video.webkitSupportsPresentationMode &&
          video.webkitSupportsPresentationMode("picture-in-picture")
        ) {
          video.webkitSetPresentationMode("picture-in-picture");
        } else {
          throw new Error("当前 WebKit 不支持画中画");
        }
      } catch (error) {
        notify("pictureInPictureError", error?.message || String(error));
      }
    }

    function destroyPlayback() {
      if (!player) return;
      try { player.pause(); } catch (_) {}
      try { player.unload(); } catch (_) {}
      try { player.detachMediaElement(); } catch (_) {}
      try { player.destroy(); } catch (_) {}
      player = null;
      video.removeAttribute("src");
      video.load();
    }

    async function startPlayback(config) {
      destroyPlayback();
      activeSessionId = config.sessionId || "";
      lastPlayerError = "";
      if (!window.mpegts || !mpegts.isSupported()) {
        notify("error", "当前 WebKit 不支持 Media Source Extensions");
        return;
      }

      // Referer / User-Agent 属于浏览器禁止脚本设置的请求头。把它们交给 WebKit，
      // 否则 mpegts.js 的 XHR 会直接抛出 Load failed；其它自定义 header 仍可透传。
      const safeHeaders = Object.fromEntries(
        Object.entries(config.headers || {}).filter(([name]) => {
          const lower = name.toLowerCase();
          return lower !== "referer" && lower !== "user-agent";
        })
      );

      player = mpegts.createPlayer({
        type: "flv",
        isLive: true,
        url: config.url,
        cors: true,
        withCredentials: false
      }, {
        enableWorker: false,
        enableStashBuffer: false,
        stashInitialSize: 128 * 1024,
        liveBufferLatencyChasing: true,
        liveBufferLatencyMaxLatency: 3,
        liveBufferLatencyMinRemain: 0.5,
        headers: safeHeaders
      });

      player.on(mpegts.Events.ERROR, (type, detail, info) => {
        const reason = info?.msg || info?.code || `${type}: ${detail}`;
        lastPlayerError = String(reason);
        notify("error", lastPlayerError);
      });
      player.attachMediaElement(video);
      player.load();
      notify("ready");
      notifyPictureInPictureAvailability();
      try {
        await player.play();
      } catch (error) {
        notify("error", error?.message || String(error));
      }
    }

    video.addEventListener("playing", () => {
      notify("playing");
      notifyPlaybackState();
    });
    video.addEventListener("pause", () => {
      notify("paused");
      notifyPlaybackState();
    });
    video.addEventListener("volumechange", notifyPlaybackState);
    video.addEventListener("loadedmetadata", notifyPictureInPictureAvailability);
    video.addEventListener("enterpictureinpicture", notifyPictureInPictureState);
    video.addEventListener("leavepictureinpicture", notifyPictureInPictureState);
    video.addEventListener("webkitpresentationmodechanged", notifyPictureInPictureState);
    video.addEventListener("error", () => {
      if (!lastPlayerError) {
        notify("error", video.error?.message || "HTMLVideoElement 播放失败");
      }
    });
    window.addEventListener("beforeunload", destroyPlayback);
  </script>
</body>
</html>
